<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3f5c" />
    <meta name="description" content="TripStamp – khám phá địa điểm bản địa Nha Trang, quét QR và sưu tầm thẻ số. Every Trip Leaves a Stamp." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet" />
    <title>TripStamp – Every Trip Leaves a Stamp</title>
      <script>
      // Áp dụng giao diện sáng/tối đã lưu trước khi vẽ trang, tránh nháy trắng.
      try {
        var p = JSON.parse(localStorage.getItem('tripstamp-display') || '{}');
        var dark = p.theme === 'dark' || (p.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
